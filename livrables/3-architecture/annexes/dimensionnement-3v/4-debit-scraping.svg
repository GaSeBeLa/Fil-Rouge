<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="Helvetica, Arial, sans-serif"><rect width="1100" height="640" fill="#ffffff"/><text x="40" y="44" font-size="24" font-weight="700" fill="#0b0b0b">Débit à tenir</text><text x="40" y="72" font-size="15" fill="#52514e">Barre = valeur haute. Le rafraîchissement du stock (1 passage par jour) dépasse l'enregistrement des liens de photos</text><text x="312" y="152" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="end">Liens de photos par seconde</text><text x="312" y="174" font-size="14" fill="#52514e" text-anchor="end">Scénario Complet</text><path d="M330,130 L391.0,130 Q395.0,130 395.0,134 L395.0,186 Q395.0,190 391.0,190 L330,190 Z" fill="#2a78d6"/><text x="407.0" y="167" font-size="18" font-weight="700" fill="#0b0b0b">4,6 à 6 par s</text><text x="312" y="282" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="end">Pages relues par seconde</text><text x="312" y="304" font-size="14" fill="#52514e" text-anchor="end">Scénario Moyen</text><path d="M330,260 L445.16666666666663,260 Q449.16666666666663,260 449.16666666666663,264 L449.16666666666663,316 Q449.16666666666663,320 445.16666666666663,320 L330,320 Z" fill="#2a78d6"/><text x="461.16666666666663" y="297" font-size="18" font-weight="700" fill="#0b0b0b">9 à 11 par s</text><text x="312" y="412" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="end">Pages relues par seconde</text><text x="312" y="434" font-size="14" fill="#52514e" text-anchor="end">Scénario Complet</text><path d="M330,390 L932.6666666666666,390 Q936.6666666666666,390 936.6666666666666,394 L936.6666666666666,446 Q936.6666666666666,450 932.6666666666666,450 L330,450 Z" fill="#2a78d6"/><text x="948.6666666666666" y="427" font-size="18" font-weight="700" fill="#0b0b0b">46 à 56 par s</text><line x1="330" x2="330" y1="115" y2="465" stroke="#52514e" stroke-width="1"/></svg>